name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ steps.version.outputs.value }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DATE: ${{ steps.version.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="bk_${GOOS}_${GOARCH}"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w \
              -X github.com/ClaudioLazaro/bitbucket-cli/internal/build.Version=${VERSION} \
              -X github.com/ClaudioLazaro/bitbucket-cli/internal/build.Commit=${COMMIT} \
              -X github.com/ClaudioLazaro/bitbucket-cli/internal/build.Date=${DATE}" \
            -o "dist/${name}${EXT}" ./cmd/bk
          if [ "${EXT}" = ".exe" ]; then
            (cd dist && zip -q "${name}.zip" "${name}${EXT}")
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}${EXT}")
          fi
          rm "dist/${name}${EXT}"

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          mkdir -p smoke
          tar -xzf dist/bk_linux_amd64.tar.gz -C smoke
          ./smoke/bk version
          ./smoke/bk --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: bk_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  snapshot:
    name: Snapshot artifact
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bk_*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bk-snapshot
          path: dist/
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bk_*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
