name: CI

on:
  push:
    branches: [main, trunk]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format and vet
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
